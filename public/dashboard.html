<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PetCare - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <h2>🐾 PetCare</h2>
        <nav>
            <ul>
                <li class="ativo" data-view="viewDashboard">Dashboard</li>
                <li data-view="viewClientes">Clientes</li>
                <li data-view="viewAnimais">Animais</li>
            </ul>
        </nav>
        <button id="btnSair">Sair</button>
    </aside>

    <main class="conteudo">

        <div id="viewDashboard" class="view">
            <h1>Olá!</h1>
            <p>Aqui está um resumo do sistema.</p>

            <section class="cards">
                <div class="card">
                    <h3>Clientes cadastrados</h3>
                    <p id="totalClientes">-</p>
                </div>
                <div class="card">
                    <h3>Animais cadastrados</h3>
                    <p id="totalAnimais">-</p>
                </div>
            </section>
        </div>

        <div id="viewClientes" class="view hidden">
            <h2>Clientes</h2>
            <table id="tabelaClientes">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <form id="formCliente" class="formulario">
                <div>
                    <label for="clienteNome">Nome</label>
                    <input type="text" id="clienteNome">
                </div>
                <div>
                    <label for="clienteTelefone">Telefone</label>
                    <input type="text" id="clienteTelefone">
                </div>
                <div>
                    <label for="clienteEmail">Email</label>
                    <input type="email" id="clienteEmail">
                </div>
                <button type="submit" id="btnSalvarCliente">Adicionar cliente</button>
                <p id="msgCliente" class="erro"></p>
            </form>
        </div>

        <div id="viewAnimais" class="view hidden">
            <h2>Animais</h2>
            <table id="tabelaAnimais">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Espécie</th>
                        <th>Raça</th>
                        <th>Idade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <form id="formAnimal" class="formulario">
                <div>
                    <label for="animalNome">Nome</label>
                    <input type="text" id="animalNome">
                </div>
                <div>
                    <label for="animalEspecie">Espécie</label>
                    <input type="text" id="animalEspecie">
                </div>
                <div>
                    <label for="animalRaca">Raça</label>
                    <input type="text" id="animalRaca">
                </div>
                <div>
                    <label for="animalIdade">Idade</label>
                    <input type="number" id="animalIdade">
                </div>
                <div>
                    <label for="animalCliente">Dono</label>
                    <select id="animalCliente"></select>
                </div>
                <button type="submit" id="btnSalvarAnimal">Adicionar animal</button>
                <p id="msgAnimal" class="erro"></p>
            </form>
        </div>

    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
